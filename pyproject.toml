[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-deals-agent"
version = "0.1.0"
description = "Agentic AI for finding discounted German grocery offers by location"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
agents = [
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "pillow>=10",
    "pypdf>=5.0",
]
scraping = [
    # Must equal the Playwright base image tag in infra/backend.Dockerfile (bundled browsers).
    "playwright==1.60.0",
]
eval = [
    "pymupdf>=1.24",
]
observability = [
    # OpenTelemetry traces of every agent step and model call, exported to the local Langfuse.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "openinference-instrumentation-openai>=0.1.20",
    "langfuse>=3.0",
]
mcp = [
    # Model Context Protocol server so external agents and IDEs can use the platform as tools.
    "mcp>=2.3,<3",
]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["agents/prompts/*.txt"]

[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
