# Default stack: Postgres + API + UI. Run through the Makefile (`make init`, `make up`), which
# passes the repo-root .env. The model servers join later as the `models` profile.
#
# UI on :28735, API on :28734, bound to BIND_ADDR (127.0.0.1 unless .env says otherwise).

name: grocery-deals-agent

services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-angebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-angebot}
      POSTGRES_DB: ${POSTGRES_DB:-angebot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the unix socket: the socket already answers during the image's init-only server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: runtime
    init: true
    shm_size: 1gb
    environment:
      APP_ENV: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Europe/Berlin
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-angebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-angebot}
      POSTGRES_DB: ${POSTGRES_DB:-angebot}
      LLM_BASE_URL: http://llm:28800/v1
      VLM_BASE_URL: http://vlm:28801/v1
      VLLM_API_KEY: ${VLLM_API_KEY:?run make init}
      EMBEDDING_MODEL: /models/bge-m3
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${MODELS_DIR:?run make init}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${BIND_ADDR:-127.0.0.1}:28734:28734"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:28735:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
