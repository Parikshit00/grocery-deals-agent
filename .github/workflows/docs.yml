name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the backend dev image (FastAPI app and mkdocs-material)
        run: make dev-image
      - name: Export the OpenAPI schema and build the site
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e PYTHONPATH=/repo/backend \
            -v "$PWD":/repo -w /repo grocery-deals-agent-dev sh -c '
              mkdir -p docs/api &&
              python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=1))" \
                > docs/api/openapi.json &&
              mkdocs build --strict -d site'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the GPU-free replay UI into site/replay
        working-directory: frontend
        run: |
          if [ ! -f public/replay/session.json ]; then
            echo "::error file=frontend/public/replay/session.json::No recorded session to publish." \
              "Record one with backend/tests/record_replay.py (docs/getting-started.md)."
            exit 1
          fi
          npm ci
          npm run build:replay -- --base /grocery-deals-agent/replay/
          cp -r dist/replay ../site/replay
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
